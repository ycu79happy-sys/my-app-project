<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Note Garden · 메모 정원</title><link rel="stylesheet" href="./style.css"></head><body>
<section id="auth"><div class="auth-card"><span class="brand">✳ NOTE GARDEN</span><h1>생각이 자라는 공간</h1><p>짧은 생각부터 오래 간직할 기록까지.<br>모든 기기에서 나만의 메모를 이어가세요.</p><form id="auth-form"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" minlength="10" autocomplete="current-password" required placeholder="10자 이상"></label><button type="submit">로그인</button><button type="button" id="register" class="secondary">새 계정 만들기</button></form><p id="auth-error" role="alert"></p><small id="auth-help">이 서버에 계정을 만듭니다. 이메일 인증·비밀번호 재설정은 아직 지원하지 않습니다.</small></div></section>
<div id="app" hidden><aside><div class="brand">✳ NOTE GARDEN</div><p class="muted">나의 메모 정원</p><button id="new">＋ 새 메모</button><nav id="notebooks"></nav><div class="aside-bottom"><button class="secondary" id="import-button">↥ 백업 가져오기</button><input id="import" type="file" multiple accept=".md,.txt,.zip,.json" hidden><button class="secondary" id="export">↧ 전체 백업</button><small id="account"></small><button class="secondary" id="logout">로그아웃</button></div></aside><section class="list-panel"><header><span class="eyebrow">YOUR COLLECTION</span><h2 id="collection">모든 메모</h2><input id="search" type="search" placeholder="메모 검색…" aria-label="메모 검색"></header><div id="notes"></div></section><main><div id="empty"><span>✳</span><h2>여기에 생각을 펼쳐보세요</h2><p>메모를 선택하거나 새 메모를 만들어 주세요.</p></div><section id="editor" hidden><div class="toolbar"><span id="status" role="status">저장됨</span><button class="secondary" id="pin">☆ 고정</button><button class="secondary" id="delete">삭제</button></div><label class="notebook-label">노트북 <input id="notebook" maxlength="200" placeholder="기본 노트북"></label><input id="title" maxlength="500" placeholder="제목 없는 메모" aria-label="메모 제목"><textarea id="body" placeholder="떠오르는 생각을 적어보세요…&#10;&#10;Markdown 형식으로 작성할 수 있습니다." aria-label="메모 본문"></textarea><footer><span id="count">0자</span><span>Markdown · 자동 저장</span></footer></section></main></div><div id="toast" role="status" hidden></div><script type="module" src="./app.js"></script></body></html>
